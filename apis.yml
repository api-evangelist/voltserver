aid: voltserver
name: VoltServer
description: |
  VoltServer, Inc. (East Greenwich, Rhode Island, with VoltServer Ltd in Tadley, UK) is the inventor
  and manufacturer of Digital Electricity, a Class 4 fault-managed power distribution technology.
  Digital Electricity breaks conventional power into short, digitally analyzed energy packets that are
  transmitted over Class 2/Class 4 cabling and reconstituted to AC or DC at a receiver, delivering
  kilowatt-scale power over long distances at the installation cost and safety profile of low-voltage
  wiring. Products are hardware: Digital Electricity transmitters (TXAC family) and receivers (RXDC,
  RXAC, TETRA families), sold into service-provider networks, data centers, smart buildings and
  campuses, industrial and manufacturing sites, building electrification and transportation networks.
  VoltServer's published software surface consists of two downloadable end-user utilities — the
  VoltServer Site Tech App (Windows) and the VoltServer Discovery Tool (macOS) — for commissioning and
  discovering deployed devices. As of the 2026-09-04 probe VoltServer publishes no public API,
  developer portal, machine-readable specification, SDK or webhook surface.
